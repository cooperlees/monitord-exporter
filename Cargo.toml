[package]
name = "monitord-exporter"
version = "0.26.2"
authors = ["Cooper Ry Lees <me@cooperlees.com>"]
license = "GPL-2.0-or-later"
readme = "README.md"
repository = "https://github.com/cooperlees/monitord-exporter"
edition = "2021"
description = """
monitord-exporter ... let prometheus know how happy your systemd is! 😊
"""
categories = ["network-programming", "os::linux-apis"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
configparser = { version = "3.1.0", features = ["indexmap"] }
monitord = "0.26"
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"], optional = true }
prometheus_exporter = "0.8"
zbus = { version = "5", features = ["tokio"], default-features = false }
signal-hook = "0.4.1"
tokio = { version = "1.41.0", feature = ["fs", "rt", "rt-multi-thread", "macros", "tracing", "time", "sync"] }
tonic = { version = "0.14", default-features = false, features = ["transport"], optional = true }
tracing = "0.1.44"
tracing-core = "0.1"
tracing-glog = "0.4"
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []
# Optional OTLP span export (see src/logging.rs). Off by default so
# consuming monitord-exporter as a library/crate doesn't pull in the
# opentelemetry/tonic dependency tree unless explicitly requested.
otlp = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tonic", "dep:tracing-opentelemetry"]

[dev-dependencies]
tempfile = "3"

[profile]
release = { strip = "symbols", lto = "thin", opt-level = "z" }
