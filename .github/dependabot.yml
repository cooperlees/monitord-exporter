version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    # These crates are version-locked to each other; separate PRs each fail CI.
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
          - "tonic"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
